<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="bg"></canvas>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; }
  #bg { position: fixed; inset: 0; z-index: -1; }  /* derrière tout, non cliquable */
</style>
<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = innerWidth;
  H = canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

// --- particules ---
const NB = 80;
const DIST = 120;            // seuil de connexion (px)
const mouse = { x: null, y: null };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });

const pts = Array.from({ length: NB }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  vx: (Math.random() - 0.5) * 0.4,   // vitesse
  vy: (Math.random() - 0.5) * 0.4,
}));

function boucle() {
  ctx.clearRect(0, 0, W, H);

  // 1. déplacer + dessiner les points
  for (const p of pts) {
    p.x += p.vx; p.y += p.vy;
    // rebond sur les bords
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = '#8ab4ff';
    ctx.fill();
  }

  // 2. relier les paires proches (O(n²))
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x;
      const dy = pts[i].y - pts[j].y;
      const d = Math.hypot(dx, dy);
      if (d < DIST) {
        const opacite = 1 - d / DIST;          // plus c'est loin, plus c'est transparent
        ctx.strokeStyle = `rgba(138,180,255,${opacite * 0.5})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[j].x, pts[j].y);
        ctx.stroke();
      }
    }

    // 3. lien vers la souris
    if (mouse.x !== null) {
      const d = Math.hypot(pts[i].x - mouse.x, pts[i].y - mouse.y);
      if (d < DIST) {
        ctx.strokeStyle = `rgba(255,255,255,${(1 - d / DIST) * 0.6})`;
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(boucle);
}
boucle();
</script>
</body>
</html>
